  <body>
    <script>
      // Apply theme + lang before paint to prevent flash.
      (function () {
        try {
          var mode = localStorage.getItem('promptos.theme') || 'dark';
          var resolved;
          if (mode === 'light' || mode === 'dark') {
            resolved = mode;
          } else {
            var h = new Date().getHours();
            resolved = (h >= 19 || h < 7) ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (resolved === 'dark') root.classList.add('dark');
          root.dataset.theme = resolved;
          root.dataset.themeMode = mode;

          var SUPPORTED = ['en', 'ru', 'uk', 'pl'];
          var lang = null;
          try {
            var fromUrl = new URLSearchParams(location.search).get('lang');
            if (fromUrl) fromUrl = fromUrl.toLowerCase().slice(0, 2);
            if (fromUrl && SUPPORTED.indexOf(fromUrl) !== -1) lang = fromUrl;
          } catch (e) {}
          if (!lang) {
            var stored = localStorage.getItem('promptos.lang');
            if (stored && SUPPORTED.indexOf(stored) !== -1) lang = stored;
          }
          if (!lang) {
            var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
            for (var i = 0; i < list.length; i++) {
              var c = String(list[i] || '').toLowerCase().slice(0, 2);
              if (SUPPORTED.indexOf(c) !== -1) { lang = c; break; }
            }
          }
          root.lang = lang || 'en';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
